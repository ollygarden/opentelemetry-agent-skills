name: Publish

on:
  push:
    branches:
      - main
    paths:
      - skills/**
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to GitHub Packages
    needs: validate
    runs-on: blacksmith
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: "@ollygarden"

      # One version per publishing run; gitHead maps it back to the commit.
      - name: Set Version
        run: npm pkg set version="1.0.${GITHUB_RUN_NUMBER}" gitHead="${GITHUB_SHA}"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
