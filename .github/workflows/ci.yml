name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-validation:
    name: Skills conform to the spec and are registered
    runs-on: blacksmith

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          # skills-ref is a pinned git dependency rather than a Python project,
          # so key the cache on the pin itself: bumping the revision in
          # bin/skills-ref.requirement is exactly when the cache must be rebuilt.
          cache-dependency-glob: bin/skills-ref.requirement

      - name: Install Agent Skills Reference Validator
        run: uv tool install "$(cat bin/skills-ref.requirement)"

      - name: Validate Skills
        run: ./bin/validate-skill.sh

      - name: Check Skill Registration
        run: ./bin/check-skill-inventory.py

  tool-tests:
    name: otel-agent-tools
    runs-on: blacksmith

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/otel-agent-tools/go.mod

      - name: Lint Tool
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: tools/otel-agent-tools
          args: ./...

      - name: Build Tool
        working-directory: tools/otel-agent-tools
        run: go build ./cmd/otel-agent-tools

      - name: Test Tool
        run: go test ./tools/otel-agent-tools/...
