accept = ["200..=299", "429"]
# Give transient upstream failures time to recover before declaring a link dead.
max_retries = 4
retry_wait_time = 3
timeout = 20
max_concurrency = 10
hidden = true
method = "get"
extensions = ["md", "markdown", "html", "txt", "rst", "sh", "yml", "yaml", "json", "toml"]
include_verbatim = false

exclude_path = [
  "(^|/)\\.git/",
  # Conditional, not dead: nothing matches this in a default run, but a local
  # `lychee --cache` creates the directory. Keep the distinction in mind when
  # pruning — an exclusion that *cannot* match is rot, one that does not match
  # *today* is not.
  "(^|/)\\.lycheecache/",
  # This config's own content is entirely link *patterns*, not links: lychee
  # reads `https://github/` and `https://api/` straight out of the regexes
  # below (5 errors when this line is removed). Excluding those by URL would
  # take one exclusion per pattern, each itself a pattern — so the file is
  # excluded wholesale. Every other file is scanned; prefer a narrow URL
  # exclusion to a path exclusion, which also hides whether a pattern still
  # works.
  "(^|/)\\.github/lychee\\.toml$",
  # Eval fixtures are synthetic inputs, written to look hostile or malformed on
  # purpose; their URLs are payloads under test, not references to check.
  "(^|/)skills/[^/]+/evals/files/"
]

exclude = [
  # renovate.json holds a matchStrings regex and a Handlebars template, so these
  # two are patterns rather than links: the escaped `https://github\.com/` reads
  # as `https://github`, and packageNameTemplate as a literal `{{{depName}}}`.
  # Excluded by URL rather than by path so the file's real $schema URL is still
  # checked.
  "^https://github/$",
  "^https://github\\.com/%7B%7B%7BdepName%7D%7D%7D$",
  # Registries that reject unattended clients with 403 rather than 404. Both are
  # rendered into the generated version index, so the pattern has to match there
  # as well as in tools/otel-agent-tools/sdk-sources.json.
  "^https://search\\.maven\\.org/artifact/io\\.opentelemetry/opentelemetry-sdk$",
  "^https://www\\.npmjs\\.com/package/@opentelemetry/sdk-node$",
  # printf and shell templates in skills/otel-semantic-conventions/scripts/. The
  # placeholders (%s, ${tag}, ${path}) are filled in at runtime, so the literal
  # string in the file is never a fetchable URL. lychee leaves `$` alone and
  # percent-encodes the braces, hence the `%7B`/`%7D` below.
  "^https://github\\.com/open-telemetry/semantic-conventions/(blob|tree)/",
  "^https://raw\\.githubusercontent\\.com/open-telemetry/semantic-conventions/\\$%7Btag%7D/",
  "^https://api\\.github\\.com/repos/open-telemetry/semantic-conventions/git/trees/\\$%7Btag%7D",
  # The lychee release URL in .github/workflows/link-check.yml, built from
  # ${LYCHEE_VERSION} at run time. Excluded by URL rather than by excluding the
  # whole workflow file, so the rest of that file still gets checked. Note the
  # encoding: lychee leaves `$` literal and percent-encodes the braces, so this
  # must be `\$%7B...%7D` — an unencoded `\$\{...\}` here would never match, and
  # a path exclusion would hide that it had stopped working.
  "^https://github\\.com/lycheeverse/lychee/releases/download/\\$%7BLYCHEE_VERSION%7D",
  # Shell template in tools/otel-telemetry-emission-scan/scripts/scan.sh:
  # the clone URL is built from $repo at run time, so the literal string in the
  # file is never a fetchable URL. lychee leaves `$` literal, hence `\$repo`.
  "^https://github\\.com/\\$repo$",
  # Example in-cluster endpoint in skill prose and eval prompts; by design it
  # resolves only inside a user's own cluster, never from CI.
  "^http://otel-gateway:4318([/?#]|$)"
]

# Most references share this host. Pace requests to reduce transient GitHub 503s
# without accepting server errors or excluding upstream source links.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
